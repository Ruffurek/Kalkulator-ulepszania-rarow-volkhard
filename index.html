<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator ulepszania rarów – Volkhard</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--line:#2a2f3d;--txt:#e6e8ee;--mut:#8b93a7;--hd:#203864;--hd2:#25324f;--in:#3a3217;--inb:#6b5a1f;--gr:#183323;--pu:#a50f5a;--pul:#3a1428;--puf:#ff8cc4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 Calibri,Segoe UI,Arial,sans-serif;padding:16px}
.wrap{max-width:1250px;margin:auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--mut);border:1px solid var(--line);padding:9px 18px;border-radius:8px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--hd);color:#fff;border-color:#34508a}
.pane{display:none}.pane.on{display:block}
.title{background:var(--hd);color:#fff;font:700 20px Arial,sans-serif;text-align:center;padding:14px 10px;border-radius:8px 8px 0 0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 4px}
.top label{font-weight:700}
.box{min-width:84px;text-align:center;font-weight:700;font-size:16px;padding:7px 12px;border-radius:6px;border:1px solid var(--line)}
.bonus{background:var(--gr);color:#9be3b2}
.note{color:var(--mut);font-size:12px;line-height:1.3}
.warn{color:#ffb454;font-style:italic;padding:0 4px 8px;min-height:22px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.card h3{margin:0;background:var(--hd);color:#fff;font:700 13px Arial,sans-serif;padding:7px 10px;text-transform:uppercase}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{background:var(--hd2);font:700 13px Arial,sans-serif;padding:8px 6px;text-align:center}
td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child{text-align:left}
th.dm{background:var(--pu);color:#fff}
tr.on td{background:#1d2740}
tr.dmr td:first-child,.dmt td{color:var(--puf);font-weight:700}
.dmr td:first-child{background:var(--pul)}
.sum td{background:var(--gr);font-weight:700}
.dmt td{background:var(--pul)}
.mid{text-align:center!important;color:var(--mut)}
.lock{background:#2a2d36;color:var(--mut)}
input[type=number]{width:100%;min-width:90px;background:var(--in);color:#ffe9a8;border:1px solid var(--inb);border-radius:5px;padding:5px 7px;font:inherit;text-align:right}
.top input[type=number]{width:84px;text-align:center;font-weight:700;font-size:16px;padding:7px}
input:focus{outline:2px solid #5b7fd1}
ol{margin:0;padding:10px 12px 10px 30px;color:var(--mut)}
ol li{padding:3px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button class="on" data-t="0">OD 1 DO 8</button>
    <button data-t="1">OD X DO Y</button>
  </div>
  <div id="p0" class="pane on"></div>
  <div id="p1" class="pane"></div>
</div>
<script>
// poziomy 1-8: Karmazynowe, Kobaltowe, Malachitowe, Daimonit, Złoto, Bonus
const L=[[0,0,0,0,0,.005],[90,20,2,1e4,2e7,.01],[110,30,6,25e3,3e7,.015],[150,50,20,5e4,5e7,.02],
[120,100,0,15e4,75e6,.025],[170,0,25,4e5,125e6,.03],[0,200,0,1e6,25e7,.035],[0,100,100,3e6,5e8,.04]];
const MAT=['Karmazynowe','Kobaltowe','Malachitowe'];
const STAT=['Siła','Zręczność','Moc','Wiedza','Zdrowie'];
const fmt=n=>(+n).toLocaleString('pl-PL',{maximumFractionDigits:2});
const num=v=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)?v:0};
const lv=v=>Math.min(Math.max(Math.trunc(num(v)),1),8);
const $=(id)=>document.getElementById(id);
const DEF=m=>({from:1,to:m?2:1,p0:0,p1:0,p2:0,drop:0,s0:0,s1:0,s2:0,s3:0,s4:0});
const RNG=m=>m?{from:[1,7],to:[2,8]}:{to:[1,8]};
const S=[0,1].map(m=>{let d=DEF(m);try{Object.assign(d,JSON.parse(localStorage.getItem('rary'+m)||'{}'))}catch(e){}return d});

function build(m){
  const inp=(k,extra='')=>`<input type="number" inputmode="decimal" data-m="${m}" data-k="${k}" ${extra}>`;
  const lvl=(k,lab)=>`<label>${lab}</label>${inp(k,`min="${RNG(m)[k][0]}" max="${RNG(m)[k][1]}" step="1"`)}`;
  const rows=L.map((r,i)=>`<tr data-lv="${i+1}"><td><b>${i+1}</b></td><td>${fmt(r[0])}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td><td>${fmt(r[3])}</td><td>${fmt(r[4])}</td><td>${(r[5]*100).toFixed(1)}%</td></tr>`).join('');
  const help=m?['Wpisz poziom obecny i docelowy – liczy się od obecnego+1 do docelowego.','W tabeli po prawej wpisz ceny w żółtych polach.','W kalkulatorze statystyk wpisz bazowe wartości w żółtych polach.','Daimonit nie ma ceny. Wpisz ile daje 1 instancja – liczba instancji wyliczy się niżej.','Poziom 1 jest bazowy; koszty liczone są od poziomu obecnego + 1.','Zera oznaczają, że dany materiał nie jest wymagany na tym poziomie.']
   :['Zmień poziom docelowy.','W tabeli po prawej wpisz ceny w żółtych polach.','W kalkulatorze statystyk wpisz bazowe wartości w żółtych polach.','Daimonit nie ma ceny. Wpisz ile daje 1 instancja – liczba instancji wyliczy się niżej.','Poziom 1 jest bazowy; koszty sumują się od poziomu 2.','Zera oznaczają, że dany materiał nie jest wymagany na tym poziomie.'];
  $('p'+m).innerHTML=`
  <div class="title">KALKULATOR ULEPSZANIA RARÓW VOLKHARD${m?' – OD POZIOMU DO POZIOMU':''}</div>
  <div class="top">${m?lvl('from','Poziom obecny (1–7):')+lvl('to','Poziom docelowy (2–8):'):lvl('to','Wpisz poziom docelowy (1–8):')}
    <label>${m?'Bonus poziomu docelowego:':'Bonus poziomu:'}</label><div class="box bonus" id="b${m}"></div>
    <div class="note">Max poziom 8<br>Max bonus 4%</div></div>
  <div class="warn" id="w${m}"></div>
  <div class="grid"><div>
    <div class="card"><h3>Wymagania na każdym poziomie</h3><div class="sc"><table>
      <tr><th>Poziom</th><th>Karmazynowe</th><th>Kobaltowe</th><th>Malachitowe</th><th class="dm">Daimonit</th><th>Złoto</th><th>Bonus</th></tr>${rows}</table></div></div>
    <div class="card"><h3>Jak używać</h3><ol>${help.map(t=>`<li>${t}</li>`).join('')}</ol></div>
  </div><div>
    <div class="card"><h3>${m?'Łączne wymagania od poziomu obecnego do docelowego':'Łączne wymagania do wybranego poziomu'}</h3><div class="sc"><table>
      <tr><th style="text-align:left">Materiał</th><th>Wymagana ilość</th><th>Cena za szt. (wpisz)</th><th>Koszt</th><th>Opis</th></tr>
      ${MAT.map((n,i)=>`<tr><td>${n}</td><td id="q${m}${i}"></td><td>${inp('p'+i,'min="0"')}</td><td id="c${m}${i}"></td><td></td></tr>`).join('')}
      <tr><td>Złoto</td><td id="q${m}3"></td><td class="lock">1</td><td id="c${m}3"></td><td></td></tr>
      <tr class="dmr"><td>Daimonit</td><td id="q${m}4"></td><td class="mid">—</td><td class="mid">—</td><td style="text-align:left">tylko ilość, bez ceny</td></tr>
      <tr class="sum"><td>SUMA KOSZTÓW (złoto)</td><td></td><td></td><td id="sg${m}"></td><td></td></tr>
      <tr><td>Daimonit z 1 instancji (wpisz)</td><td></td><td>${inp('drop','min="0"')}</td><td></td><td style="text-align:left;color:var(--mut)">szt. na instancję</td></tr>
      <tr class="dmt"><td>SUMA DAIMONITU (szt.)</td><td></td><td></td><td id="sd${m}"></td><td id="si${m}" style="text-align:left"></td></tr>
    </table></div></div>
    <div class="card"><h3>Kalkulator statystyk</h3><div class="sc"><table>
      <tr><th style="text-align:left">Statystyka</th><th>Wartość bazowa</th><th>Bonus %</th><th>Dodana wartość</th><th>Wartość łączna</th></tr>
      ${STAT.map((n,i)=>`<tr><td>${n}</td><td>${inp('s'+i,'min="0"')}</td><td id="sb${m}${i}"></td><td id="sa${m}${i}"></td><td id="st${m}${i}"></td></tr>`).join('')}
    </table></div></div>
  </div></div>`;
}

function calc(m){
  const s=S[m], F=m?lv(s.from):1, T=lv(s.to), ok=T>F, bon=T*0.005;
  const q=[0,0,0,0,0];
  if(ok)for(let l=F+1;l<=T;l++)for(let j=0;j<5;j++)q[j]+=L[l-1][j];
  // kolejność: karm, kob, mal, daimonit, złoto -> wyświetlamy złoto jako [3], daimonit jako [4]
  const mat=[q[0],q[1],q[2],q[4],q[3]];
  const cost=[0,1,2].map(i=>mat[i]*num(s['p'+i])); cost[3]=mat[3];
  const sumG=cost[0]+cost[1]+cost[2]+cost[3];
  const drop=num(s.drop), inst=drop>0?Math.ceil(mat[4]/drop):0;
  for(let i=0;i<5;i++)$('q'+m+i).textContent=fmt(mat[i]);
  for(let i=0;i<4;i++)$('c'+m+i).textContent=fmt(cost[i]);
  $('sg'+m).textContent=fmt(sumG);
  $('sd'+m).textContent=fmt(mat[4]);
  $('si'+m).textContent='= '+fmt(inst)+' inst.';
  $('b'+m).textContent=(bon*100).toFixed(1).replace('.',',')+'%';
  for(let i=0;i<5;i++){const b=num(s['s'+i]),a=b*bon;
    $('sb'+m+i).textContent=(bon*100).toFixed(1).replace('.',',')+'%';$('sa'+m+i).textContent=fmt(a);$('st'+m+i).textContent=fmt(b+a);}
  $('p'+m).querySelectorAll('tr[data-lv]').forEach(r=>r.classList.toggle('on',ok&&+r.dataset.lv>F&&+r.dataset.lv<=T));
  if(m)$('w'+m).textContent=ok?`Liczone koszty od poziomu ${F+1} do ${T}`:'⚠ Poziom docelowy musi być wyższy niż obecny';
}
function save(m){try{localStorage.setItem('rary'+m,JSON.stringify(S[m]))}catch(e){}}
function fix(el){ // poprawia wartość w polu: zakres, puste -> domyślna
  const m=+el.dataset.m,k=el.dataset.k,r=RNG(m)[k],d=DEF(m)[k];
  let v=el.value==='' ? d : num(el.value);
  v=r?Math.min(Math.max(Math.trunc(v),r[0]),r[1]):Math.max(v,0);
  el.value=v;S[m][k]=v;save(m);calc(m);
}
function init(){
  [0,1].forEach(m=>{build(m);
    document.querySelectorAll(`#p${m} input`).forEach(el=>{
      const k=el.dataset.k;el.value=S[m][k];
      el.addEventListener('input',()=>{S[m][k]=el.value;save(m);calc(m);
        if(el.value==='')setTimeout(()=>{if(el.value==='')fix(el)},1000);}); // puste pole wraca po 1 s
      el.addEventListener('change',()=>fix(el));
    });
    document.querySelectorAll(`#p${m} input`).forEach(fix);
  });
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
    [0,1].forEach(m=>$('p'+m).classList.toggle('on',m==b.dataset.t));
  });
}
init();
</script>
</body>
</html>
